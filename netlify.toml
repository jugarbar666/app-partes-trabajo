[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"

# Configuración específica por entorno y rama para Netlify (persiste automáticamente en cualquier despliegue)
[context.production.environment]
  VITE_SHOW_MOBILE_PREVIEW = "false"
  VITE_ENABLE_DEMO_USER_SWITCH = "false"
  VITE_BRANCH = "empresa-fontaneria-roma"

[context.empresa-fontaneria-roma.environment]
  VITE_SHOW_MOBILE_PREVIEW = "false"
  VITE_ENABLE_DEMO_USER_SWITCH = "false"
  VITE_BRANCH = "empresa-fontaneria-roma"

[context.main.environment]
  VITE_SHOW_MOBILE_PREVIEW = "false"
  VITE_ENABLE_DEMO_USER_SWITCH = "false"
  VITE_BRANCH = "empresa-fontaneria-roma"

[context.pruebas.environment]
  VITE_SHOW_MOBILE_PREVIEW = "true"
  VITE_ENABLE_DEMO_USER_SWITCH = "true"
  VITE_BRANCH = "pruebas"
