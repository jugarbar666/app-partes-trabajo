<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Aplicación de gestión de partes de trabajo, revisiones periódicas, lista de compra y control horario" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gestión de partes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Gestión de partes</title>
    <script>
      window.addEventListener('error', function(e) {
        var box = document.getElementById('debug-error-box');
        if (!box) {
          box = document.createElement('div');
          box.id = 'debug-error-box';
          box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172a;color:#f87171;padding:24px;z-index:999999;font-family:sans-serif;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;';
          document.body.appendChild(box);
        }
        var msg = e.error ? (e.error.stack || e.error.message) : e.message;
        box.innerHTML = '<div style="background:#1e293b;border:1px solid #ef4444;border-radius:16px;padding:24px;max-width:600px;width:100%;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);"><h2 style="color:#fff;margin-top:0;">⚠️ Se ha detectado un error al cargar la app</h2><pre style="background:#0f172a;color:#fca5a5;padding:12px;border-radius:8px;font-size:12px;overflow:auto;white-space:pre-wrap;max-height:200px;">' + msg + '</pre><div style="display:flex;gap:12px;margin-top:16px;"><button onclick="location.reload()" style="flex:1;padding:10px 16px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">🔄 Recargar</button><button onclick="localStorage.clear();location.reload()" style="flex:1;padding:10px 16px;background:#dc2626;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">🧹 Limpiar caché local</button></div></div>';
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
